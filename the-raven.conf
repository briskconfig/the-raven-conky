conky.config = {

--Various settings
background = true,
cpu_avg_samples = 3,
diskio_avg_samples = 10,
double_buffer = true,
if_up_strictness = 'address',
net_avg_samples = 2,
no_buffers = true,
temperature_unit = 'celsius',
text_buffer_size = 2048,
update_interval = 1,
imlib_cache_size = 0,

--Placement
alignment = 'middle_right',
gap_x = 20,
gap_y = 0,
minimum_height = 600,
minimum_width = 512,
maximum_width = 512,

--Graphical
border_inner_margin = 10,
border_outer_margin = 5, 
border_width = 0, 	
default_bar_width = 256,	
default_bar_height = 3,
default_gauge_height = 25,
default_gauge_width =40,
default_graph_height = 40,
default_graph_width = 0,
default_shade_color = '#000000',
default_outline_color = '#000000',
draw_borders = false,
draw_graph_borders = true,
draw_shades = false,
draw_outline = false,
stippled_borders = 0,

--Textual
extra_newline = false,
format_human_readable = true,
font = 'Roboto Mono:size=12', 
max_text_width = 0,	
max_user_text = 16384,
override_utf8_locale = true,
short_units = true,
top_name_width = 21,
top_name_verbose = false,
uppercase = false,
use_spacer = 'none',
use_xft = true,
xftalpha = 1,

--Windows
own_window = true,
own_window_argb_value = 200,
own_window_argb_visual = true,
own_window_colour = '#000000',
own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',  
own_window_transparent = false,
own_window_title = 'system_conky',
own_window_type = 'desktop',

--Colours
default_color = '#CEAF51', -- yellowish gold
color2 = '#D9DDE2', -- whiteish grey

};

conky.text = [[
${font TerminessTTF NFM:bold:size=15}${alignr}${execi 300 echo "1 BTC = $(curl -s https://api.coinbase.com/v2/prices/btc-usd/spot | jq -r ".data.amount" | sed -E 's/(.+)/$\1/')" }${font} ${alignr}${image $XH/conky/the-raven-conky-theme/res/map.png -s 156x104 -p 364,24}
${execi 300 $XH/conky/the-raven-conky-theme/scripts/weather.sh}\
${font Symbols NFM:size=14}󰘊${font Roberto:bold:size=12}${execi 5 $XH/conky/the-raven-conky-theme/scripts/ssid} | ${color}${addrs wlan0} | ${downspeed wlan0} DN / ${upspeed wlan0} UP
${color}${font TerminessTTF NFM:size=27}${time %H:%M}${font} | ${font Symbols NFM:size=15}${font} ${font Roberto:size=12}${execi 100 cat ~/.cache/weather.json | jq '.main.temp' | awk '{print int($1+0.5)}'} °F , ${execi 100 cat ~/.cache/weather.json | jq -r '.weather[0].main'}${font}
${color}${font Iosevka NFM:size=11}${time %A, %B %e}${execi 300 $XH/conky/the-raven-conky-theme/scripts/date_suffix}${font}
${color}${font Symbols NFM:size=11}${execi 496 $XH/conky/the-raven-conky-theme/scripts/day2dot}
${alignr}${font Roberto:size=12}${uptime}
${color}${font Roboto:size=10}B A T:      ${battery_short BAT1}       ${battery_bar 3,400 BAT1}
${color}${font Roboto:size=10}C P U  ${execi 10 sensors | grep 'Core 0' | awk {'print $3'}}  ${hr 2}${font}${color} 
${color2}History:${color} ${alignr}${cpugraph 12,400}
${color2}${offset 30}CPU Core 1:${color} ${alignr}${offset -00}${cpu cpu0}%${alignr}${cpubar cpu0}
${color2}${offset 30}CPU Core 2:${color} ${alignr}${offset -00}${cpu cpu1}%${alignr}${cpubar cpu1}
${color2}${offset 30}CPU Core 3:${color} ${alignr}${offset -00}${cpu cpu2}%${alignr}${cpubar cpu2}
${color2}${offset 30}CPU Core 4:${color} ${alignr}${offset -00}${cpu cpu3}%${alignr}${cpubar cpu3}
${color2}${offset 30}CPU Core 5:${color} ${alignr}${offset -00}${cpu cpu4}%${alignr}${cpubar cpu4}
${color2}${offset 30}CPU Core 6:${color} ${alignr}${offset -00}${cpu cpu5}%${alignr}${cpubar cpu5}
${color2}${offset 30}CPU Core 7:${color} ${alignr}${offset -00}${cpu cpu6}%${alignr}${cpubar cpu6}
${color2}${offset 30}CPU Core 8:${color} ${alignr}${offset -00}${cpu cpu7}%${alignr}${cpubar cpu7}
${color2}Top Processes${goto 400}  cpu%${goto 472}  mem%${color}
${voffset 4}  1 - ${top name 1}${alignr}${goto 170} ${goto 400}${top cpu 1} ${goto 472}${top mem 1}
  2 - ${top name 2}${alignr}     ${goto 400}${top cpu 2} ${goto 472}${top mem 2}
  3 - ${top name 3}${alignr}     ${goto 400}${top cpu 3} ${goto 472}${top mem 3}
  4 - ${top name 4}${alignr}     ${goto 400}${top cpu 4} ${goto 472}${top mem 4}
  5 - ${top name 5}${alignr}     ${goto 400}${top cpu 5} ${goto 472}${top mem 5}
  6 - ${top name 6}${alignr}     ${goto 400}${top cpu 6} ${goto 472}${top mem 6}
  7 - ${top name 7}${alignr}     ${goto 400}${top cpu 7} ${goto 472}${top mem 7}
  8 - ${top name 8}${alignr}     ${goto 400}${top cpu 8} ${goto 472}${top mem 8}
${color}${font Roboto:size=10}M E M   ${hr 2}${font}${color}
${color2}${offset 30}RAM: ${color}${alignr}${offset -10}${mem} / ${memmax}${alignr}${membar}
${color2}${offset 30}Swap:${color} ${alignr}${offset -10}${swap} / ${swapmax}${alignr}${swapbar}
${color2}Top Processes${goto 400}  cpu%${goto 472}  mem%${color}
${voffset 4}  1  -  ${top_mem name 1}${alignr}${goto 170} ${goto 400}${top_mem cpu 1} ${goto 472}${top_mem mem 1}
  2  -  ${top_mem name 2}${alignr}${goto 170} ${goto 400}${top_mem cpu 2} ${goto 472}${top_mem mem 2}
  3  -  ${top_mem name 3}${alignr}${goto 170} ${goto 400}${top_mem cpu 3} ${goto 472}${top_mem mem 3}
  4  -  ${top_mem name 4}${alignr}${goto 170} ${goto 400}${top_mem cpu 4} ${goto 472}${top_mem mem 4}
  5  -  ${top_mem name 5}${alignr}${goto 170} ${goto 400}${top_mem cpu 5} ${goto 472}${top_mem mem 5}
  6  -  ${top_mem name 6}${alignr}${goto 170} ${goto 400}${top_mem cpu 6} ${goto 472}${top_mem mem 6}
  7  -  ${top_mem name 7}${alignr}${goto 170} ${goto 400}${top_mem cpu 7} ${goto 472}${top_mem mem 7}
  8  -  ${top_mem name 8}${alignr}${goto 170} ${goto 400}${top_mem cpu 8} ${goto 472}${top_mem mem 8}
${color}${font Roboto:size=10}S T O R A G E   ${hr 2}${font}${color}
${offset 30}${color2}Root:${color} ${alignr}${offset -10}${fs_used /} / ${fs_size /}${alignr}${fs_bar}
${offset 30}${color2}NAS:${color} ${alignr}${offset -10}${fs_used /media/nas} / ${fs_size /media/nas}${alignr}${fs_bar}
${offset 30}${color2}sda Read:${color} ${alignr}${offset -10}${diskio_read /dev/sda1}${alignr}${diskiograph_read nvme0n1p2 18,256}
${offset 30}${color2}sda Write:${color} ${alignr}${offset -10}${diskio_write /dev/sda1}${alignr}${diskiograph_write nvme0n1p2 18,256}
${color}${font Roboto:size=10}M U S I C   ${hr 2}${font}${color}
${voffset 20}${goto 140}${font Roberto:size=11:bold}$mpd_title$font
${goto 140}$mpd_artist
${goto 140}$mpd_album
${goto 140}$mpd_elapsed
${goto 140}${mpd_bar 5,320}
${execi 1 $XH/conky/the-raven-conky-theme/scripts/cover.sh}${image /tmp/conkyCover.png -p 0, 1024}
]];

